name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  smoke_test:
    name: Local smoke test amd64 + arm64
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Local smoke build linux/amd64
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --tag nekosuneai-smoke:amd64 \
            --build-arg APP_VERSION=${{ steps.version.outputs.version }} \
            --cache-from type=gha,scope=nekosuneai-smoke-amd64 \
            --cache-to type=gha,mode=max,scope=nekosuneai-smoke-amd64 \
            .

          test "$(docker image inspect nekosuneai-smoke:amd64 --format '{{.Architecture}}')" = "amd64"

          docker run --rm \
            --platform linux/amd64 \
            --entrypoint python \
            nekosuneai-smoke:amd64 \
            -c "import platform; import vosk; import nekosuneai.launcher; assert platform.machine() in ('x86_64','amd64'); print('amd64 Python/Vosk smoke test OK')"

          docker run --rm \
            --platform linux/amd64 \
            -e STT_PROVIDER=bridge \
            nekosuneai-smoke:amd64 \
            --help >/tmp/nekosuneai-amd64-help.txt

          grep -q "Run NekoSuneAI" /tmp/nekosuneai-amd64-help.txt
          echo "amd64 container startup smoke test OK"

      - name: Local smoke build linux/arm64
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/arm64 \
            --load \
            --tag nekosuneai-smoke:arm64 \
            --build-arg APP_VERSION=${{ steps.version.outputs.version }} \
            --cache-from type=gha,scope=nekosuneai-smoke-arm64 \
            --cache-to type=gha,mode=max,scope=nekosuneai-smoke-arm64 \
            .

          test "$(docker image inspect nekosuneai-smoke:arm64 --format '{{.Architecture}}')" = "arm64"

          docker run --rm \
            --platform linux/arm64 \
            --entrypoint python \
            nekosuneai-smoke:arm64 \
            -c "import platform; import vosk; import nekosuneai.launcher; assert platform.machine() in ('aarch64','arm64'); print('arm64 Python/Vosk smoke test OK')"

          docker run --rm \
            --platform linux/arm64 \
            -e STT_PROVIDER=bridge \
            nekosuneai-smoke:arm64 \
            --help >/tmp/nekosuneai-arm64-help.txt

          grep -q "Run NekoSuneAI" /tmp/nekosuneai-arm64-help.txt
          echo "arm64 container startup smoke test OK"

      - name: Clean local smoke images
        if: always()
        run: |
          docker image rm -f nekosuneai-smoke:amd64 nekosuneai-smoke:arm64 2>/dev/null || true
          rm -f /tmp/nekosuneai-amd64-help.txt /tmp/nekosuneai-arm64-help.txt

  sync_release_tag:
    name: Update version tag after smoke tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: smoke_test
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move version tag to tested main commit
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail
          release_tag="v$(cat VERSION)"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          git tag -f "$release_tag" "$GITHUB_SHA"
          git push --force origin "refs/tags/$release_tag"
          echo "Moved $release_tag to tested commit $GITHUB_SHA"

      - name: Start version Docker publish
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const releaseTag = process.env.RELEASE_TAG;
            core.info(`Dispatching release.yml at ${releaseTag}`);
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yml',
              ref: releaseTag,
            });
            core.info(`Started Docker publish workflow for ${releaseTag}`);

  docker:
    name: Publish Docker amd64 + Raspberry Pi arm64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Read release version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify release version
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and publish tested Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: |
            type=gha,scope=nekosuneai-smoke-amd64
            type=gha,scope=nekosuneai-smoke-arm64
            type=gha,scope=nekosuneai-publish
          cache-to: type=gha,mode=max,scope=nekosuneai-publish
          provenance: true
          sbom: true

  release:
    name: Publish Docker release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: docker
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            NekoSuneAI is distributed as Docker images only.

            Registry: `ghcr.io/${{ github.repository }}`
            Version: `${{ github.ref_name }}`
            Platforms: `linux/amd64` and `linux/arm64` for Raspberry Pi 4/5.
            This release tag is updated only after both architectures pass local smoke tests on `main`.

            Copy `.env.docker.example` to `.env`, replace the placeholder
            values, then start with `docker compose up -d`.
