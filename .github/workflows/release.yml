name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  sync_release_tag:
    name: Sync v1.2.1 tag to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move v1.2.1 to this main commit
        run: |
          git tag -f v1.2.1 "$GITHUB_SHA"
          git push --force origin refs/tags/v1.2.1

      # Tag pushes made with GITHUB_TOKEN do not start another workflow run,
      # so explicitly dispatch this workflow at the version tag. The Docker
      # job below only runs when github.ref is refs/tags/v*.
      - name: Start v1.2.1 Docker build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref v1.2.1

  docker:
    name: Test then publish Docker amd64 + Raspberry Pi arm64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Read release version
        id: version
        shell: bash
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify release version
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Build each architecture locally first. Nothing is pushed to GHCR until
      # both local smoke builds and runtime checks succeed.
      - name: Local smoke build linux/amd64
        shell: bash
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --tag nekosuneai-smoke:amd64 \
            --build-arg APP_VERSION=${{ steps.version.outputs.version }} \
            .

          test "$(docker image inspect nekosuneai-smoke:amd64 --format '{{.Architecture}}')" = "amd64"

          docker run --rm \
            --platform linux/amd64 \
            --entrypoint python \
            nekosuneai-smoke:amd64 \
            -c "import vosk; import nekosuneai.launcher; print('amd64 smoke test OK')"

      - name: Local smoke build linux/arm64
        shell: bash
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --load \
            --tag nekosuneai-smoke:arm64 \
            --build-arg APP_VERSION=${{ steps.version.outputs.version }} \
            .

          test "$(docker image inspect nekosuneai-smoke:arm64 --format '{{.Architecture}}')" = "arm64"

          docker run --rm \
            --platform linux/arm64 \
            --entrypoint python \
            nekosuneai-smoke:arm64 \
            -c "import vosk; import nekosuneai.launcher; print('arm64 smoke test OK')"

      - name: Clean local smoke images
        if: always()
        run: |
          docker image rm -f nekosuneai-smoke:amd64 nekosuneai-smoke:arm64 2>/dev/null || true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  release:
    name: Publish Docker release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: docker
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            NekoSuneAI is distributed as Docker images only.

            Registry: `ghcr.io/${{ github.repository }}`
            Version: `${{ github.ref_name }}`
            Platforms: `linux/amd64` and `linux/arm64` for Raspberry Pi 4/5.
            Both architectures are locally smoke-built and runtime-tested before publishing.

            Copy `.env.docker.example` to `.env`, replace the placeholder
            values, then start with `docker compose up -d`.
