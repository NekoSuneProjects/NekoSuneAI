name: Android APK Build

on:
  push:
    branches:
      - 'build/android-apk'
    paths:
      - 'android/**'
      - '.github/workflows/android-companion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Runner memory before build
        run: |
          free -h || true
          echo "cgroup memory.max: $(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo unknown)"
          echo "cgroup memory.current: $(cat /sys/fs/cgroup/memory.current 2>/dev/null || echo unknown)"
      - name: Build Android debug APK
        run: gradle -p android --no-daemon --max-workers=1 assembleDebug --stacktrace
      - name: Runner memory after build
        if: always()
        run: |
          free -h || true
          echo "cgroup memory.current: $(cat /sys/fs/cgroup/memory.current 2>/dev/null || echo unknown)"
          if command -v journalctl >/dev/null 2>&1; then
            journalctl -k -n 80 --no-pager 2>/dev/null | grep -Ei 'oom|out of memory|killed process' || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: NekoSuneAI-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
