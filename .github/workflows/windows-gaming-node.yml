name: Windows Gaming Node

on:
  workflow_dispatch:
  push:
    branches:
      - build/windows-gaming-node-release

permissions:
  contents: write

concurrency:
  group: windows-gaming-node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows Gaming Node
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-windows-gaming-node.txt

      - name: Install build dependencies
        shell: pwsh
        timeout-minutes: 10
        run: |
          # vgamepad normally tries to launch the interactive ViGEmBus MSI while
          # pip is preparing/building the package. That blocks unattended
          # GitHub Actions runners indefinitely. The release EXE only needs the
          # vgamepad Python files + bundled ViGEmClient DLL; users install the
          # ViGEmBus driver on the actual gaming PC when controller emulation is
          # required.
          $env:VGAMEPAD_SKIP_VIGEMBUS_INSTALL = 'true'
          python -m pip install --disable-pip-version-check -r requirements-windows-gaming-node.txt

      - name: Verify virtual controller package
        shell: pwsh
        run: |
          $env:VGAMEPAD_SKIP_VIGEMBUS_INSTALL = 'true'
          python -c "import vgamepad; print('vgamepad package import OK')"

      - name: Build standalone EXE
        shell: pwsh
        timeout-minutes: 10
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name NekoSuneAI-Windows-Gaming-Node `
            --icon data/logo.ico `
            --collect-all vgamepad `
            --collect-all obsws_python `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import pytesseract `
            tools/windows_gaming_node_entry.py

      - name: Smoke test executable
        shell: pwsh
        timeout-minutes: 2
        run: |
          .\dist\NekoSuneAI-Windows-Gaming-Node.exe --help

      - name: Package Gaming Node and console Remote Play profiles
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $root = "release/NekoSuneAI-Windows-Gaming-Node-$version"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item dist/NekoSuneAI-Windows-Gaming-Node.exe $root/
          Copy-Item config/windows-gaming-agent.example.json "$root/windows-gaming-agent.example.json"
          Copy-Item docs/GAME_SKILLS_AND_REMOTE_PLAY.md "$root/GAME_SKILLS_AND_REMOTE_PLAY.md"
          Copy-Item game-skills "$root/game-skills" -Recurse

          @'
          NekoSuneAI Windows Gaming Node

          1. Copy windows-gaming-agent.example.json to windows-gaming-agent.json and configure your Docker/Pi NekoSuneAI server URL.
          2. Pair the node from the NekoSuneAI dashboard.
          3. Run a reviewed game profile with --game <id>.

          Examples:
            NekoSuneAI-Windows-Gaming-Node.exe --config windows-gaming-agent.json --skills-root game-skills --game minecraft
            NekoSuneAI-Windows-Gaming-Node.exe --config windows-gaming-agent.json --skills-root game-skills --game xbox-remote-play
            NekoSuneAI-Windows-Gaming-Node.exe --config windows-gaming-agent.json --skills-root game-skills --game playstation-remote-play

          Controller emulation is bundled in the EXE, but the ViGEmBus driver must be installed on the gaming PC before Xbox 360 / DualShock 4 virtual controller support can work. The GitHub build deliberately does not install drivers on the CI runner.

          Xbox/PlayStation Remote Play currently uses the authenticated Windows Remote Play client as the streaming window. The package does not bypass console authentication or pairing.
          '@ | Set-Content "$root/README-WINDOWS-GAMING-NODE.txt"

          Compress-Archive -Path "$root/*" -DestinationPath "release/NekoSuneAI-Windows-Gaming-Node-$version-build-${{ github.run_number }}.zip" -Force
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        id: package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NekoSuneAI-Windows-Gaming-Node-${{ steps.package.outputs.version }}
          path: release/*.zip
          if-no-files-found: error

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-gaming-node-v${{ steps.package.outputs.version }}-build-${{ github.run_number }}
          name: Windows Gaming Node v${{ steps.package.outputs.version }} (Build ${{ github.run_number }})
          prerelease: true
          generate_release_notes: false
          body: |
            Windows Gaming Node build for NekoSuneAI.

            Includes the standalone Windows Gaming Node executable plus bundled reviewed game-skill profiles, including Xbox Remote Play and PlayStation Remote Play templates.

            Virtual controller support is bundled, but ViGEmBus must be installed on the target Windows gaming PC. The CI build does not attempt interactive driver installation.
          files: release/*.zip
