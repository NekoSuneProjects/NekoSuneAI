name: Windows Gaming Node

# HIDMaestro's driver is never installed in GitHub Actions.
on:
  workflow_dispatch:
  push:
    branches: [build/windows-gaming-node-release]
    paths:
      - 'nekosuneai/android_gameplay/**'
      - 'tools/start_windows_android_fallback.ps1'
      - 'requirements-windows-android-fallback.txt'
      - 'NekoSuneAI-Windows-Gaming-Node.spec'
      - 'nekosuneai/hidmaestro_client.py'
      - 'nekosuneai/windows_gaming_agent.py'
      - 'tools/hidmaestro-bridge/**'
      - '.github/workflows/windows-gaming-node.yml'

permissions:
  contents: write

concurrency:
  group: windows-gaming-node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows Gaming Node
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-windows-gaming-node.txt

      - name: Install build dependencies
        shell: pwsh
        timeout-minutes: 10
        run: |
          python -m pip install --disable-pip-version-check -r requirements-windows-gaming-node.txt

      - name: Verify package imports
        shell: pwsh
        run: |
          python -c "import nekosuneai; import nekosuneai.windows_gaming_agent; print('Windows Gaming Node imports OK (HIDMaestro sidecar optional)')"

      - name: Build standalone GUI EXE
        shell: pwsh
        timeout-minutes: 10
        run: |
          python -m PyInstaller --noconfirm --clean NekoSuneAI-Windows-Gaming-Node.spec

      - name: Smoke test package imports before release
        shell: pwsh
        timeout-minutes: 2
        run: |
          python -c "from nekosuneai.windows_gaming_agent import WindowsGamingAgent; from nekosuneai.game_skills import GameSkillLibrary; print('smoke test OK')"

      - name: Package Gaming Node GUI and game profiles
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $root = "release/NekoSuneAI-Windows-Gaming-Node-$version"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item dist/NekoSuneAI-Windows-Gaming-Node.exe $root/
          Copy-Item config/windows-gaming-agent.example.json "$root/windows-gaming-agent.example.json"
          Copy-Item docs/GAME_SKILLS_AND_REMOTE_PLAY.md "$root/GAME_SKILLS_AND_REMOTE_PLAY.md"
          Copy-Item docs/WINDOWS_MEDIA_AND_VRCHAT.md "$root/WINDOWS_MEDIA_AND_VRCHAT.md"
          Copy-Item game-skills "$root/game-skills" -Recurse
          New-Item -ItemType Directory -Force -Path "$root/nekosuneai" | Out-Null
          Copy-Item nekosuneai/__init__.py "$root/nekosuneai/__init__.py"
          Copy-Item nekosuneai/android_gameplay "$root/nekosuneai/android_gameplay" -Recurse
          New-Item -ItemType Directory -Force -Path "$root/tools" | Out-Null
          Copy-Item tools/start_windows_android_fallback.ps1 "$root/tools/"
          Copy-Item requirements-windows-android-fallback.txt "$root/"

          @'
          NekoSuneAI Windows Gaming Node

          Launch NekoSuneAI-Windows-Gaming-Node.exe.

          The Windows app now provides a GUI for:
          - NekoSuneAI server address setup
          - LAN discovery of common NekoSuneAI hostnames
          - pairing ID + pairing code registration
          - local device-token storage
          - game / Xbox Remote Play / PlayStation Remote Play profile selection
          - start/stop status for the Windows Gaming Node
          - optional BlueStacks Android worker via tools/start_windows_android_fallback.ps1

          No CLI arguments are required for normal setup.

          Virtual Xbox 360 / DualShock 4 support uses optional HIDMaestro .NET 10 sidecar. The driver must be installed on the user's own Windows PC. CI never installs drivers.
          '@ | Set-Content "$root/README-WINDOWS-GAMING-NODE.txt"

          Compress-Archive -Path "$root/*" -DestinationPath "release/NekoSuneAI-Windows-Gaming-Node-$version-build-${{ github.run_number }}.zip" -Force
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        id: package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NekoSuneAI-Windows-Gaming-Node-${{ steps.package.outputs.version }}
          path: release/*.zip
          if-no-files-found: error

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-gaming-node-v${{ steps.package.outputs.version }}-build-${{ github.run_number }}
          name: Windows Gaming Node v${{ steps.package.outputs.version }} (Build ${{ github.run_number }})
          prerelease: true
          generate_release_notes: false
          body: |
            Windows Gaming Node GUI build for NekoSuneAI.

            Includes graphical server setup, pairing, device-token storage, profile selection and start/stop controls. Includes optional BlueStacks Android companion launcher and source modules (run with Python/ADB).

            Virtual gamepad support uses the optional HIDMaestro .NET sidecar and a user-installed HIDMaestro driver; no driver is installed in CI.
          files: release/*.zip
