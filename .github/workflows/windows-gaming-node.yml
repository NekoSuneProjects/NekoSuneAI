name: Windows Gaming Node

on:
  workflow_dispatch:
  push:
    branches:
      - build/windows-gaming-node-release

permissions:
  contents: write

concurrency:
  group: windows-gaming-node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows Gaming Node
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-windows-gaming-node.txt

      - name: Install build dependencies
        shell: pwsh
        timeout-minutes: 10
        run: |
          $env:VGAMEPAD_SKIP_VIGEMBUS_INSTALL = 'true'
          python -m pip install --disable-pip-version-check -r requirements-windows-gaming-node.txt

      - name: Verify package imports
        shell: pwsh
        run: |
          $env:VGAMEPAD_SKIP_VIGEMBUS_INSTALL = 'true'
          python -c "import nekosuneai; import nekosuneai.windows_gaming_agent; import vgamepad; print('Windows Gaming Node imports OK')"

      - name: Build standalone GUI EXE
        shell: pwsh
        timeout-minutes: 10
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name NekoSuneAI-Windows-Gaming-Node `
            --icon data/logo.ico `
            --paths . `
            --collect-submodules nekosuneai `
            --collect-all vgamepad `
            --collect-all obsws_python `
            --hidden-import nekosuneai `
            --hidden-import nekosuneai.game_skills `
            --hidden-import nekosuneai.windows_gaming_agent `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import pytesseract `
            tools/windows_gaming_node_gui.py

      - name: Smoke test package imports before release
        shell: pwsh
        timeout-minutes: 2
        run: |
          python -c "from nekosuneai.windows_gaming_agent import WindowsGamingAgent; from nekosuneai.game_skills import GameSkillLibrary; print('smoke test OK')"

      - name: Package Gaming Node GUI and game profiles
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $root = "release/NekoSuneAI-Windows-Gaming-Node-$version"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item dist/NekoSuneAI-Windows-Gaming-Node.exe $root/
          Copy-Item config/windows-gaming-agent.example.json "$root/windows-gaming-agent.example.json"
          Copy-Item docs/GAME_SKILLS_AND_REMOTE_PLAY.md "$root/GAME_SKILLS_AND_REMOTE_PLAY.md"
          Copy-Item game-skills "$root/game-skills" -Recurse

          @'
          NekoSuneAI Windows Gaming Node

          Launch NekoSuneAI-Windows-Gaming-Node.exe.

          The Windows app now provides a GUI for:
          - NekoSuneAI server address setup
          - LAN discovery of common NekoSuneAI hostnames
          - pairing ID + pairing code registration
          - local device-token storage
          - game / Xbox Remote Play / PlayStation Remote Play profile selection
          - start/stop status for the Windows Gaming Node

          No CLI arguments are required for normal setup.

          Virtual Xbox 360 / DualShock 4 controller support uses vgamepad and requires ViGEmBus on the actual Windows gaming PC. The CI runner does not install device drivers.
          '@ | Set-Content "$root/README-WINDOWS-GAMING-NODE.txt"

          Compress-Archive -Path "$root/*" -DestinationPath "release/NekoSuneAI-Windows-Gaming-Node-$version-build-${{ github.run_number }}.zip" -Force
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        id: package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NekoSuneAI-Windows-Gaming-Node-${{ steps.package.outputs.version }}
          path: release/*.zip
          if-no-files-found: error

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-gaming-node-v${{ steps.package.outputs.version }}-build-${{ github.run_number }}
          name: Windows Gaming Node v${{ steps.package.outputs.version }} (Build ${{ github.run_number }})
          prerelease: true
          generate_release_notes: false
          body: |
            Windows Gaming Node GUI build for NekoSuneAI.

            Includes graphical server setup, pairing, device-token storage, profile selection and start/stop controls.

            Virtual controller support is bundled, but ViGEmBus must be installed on the target Windows gaming PC.
          files: release/*.zip
