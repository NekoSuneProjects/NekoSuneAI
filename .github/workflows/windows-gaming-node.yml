name: Windows Gaming Node

on:
  workflow_dispatch:
  push:
    branches:
      - build/windows-gaming-node-release

permissions:
  contents: write

concurrency:
  group: windows-gaming-node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows Gaming Node
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-windows-gaming-node.txt

      - name: Install only Gaming Node dependencies
        shell: pwsh
        run: python -m pip install -r requirements-windows-gaming-node.txt

      - name: Build standalone EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --onefile `
            --name NekoSuneAI-Windows-Gaming-Node `
            --icon data/logo.ico `
            --collect-all vgamepad `
            --collect-all obsws_python `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import pytesseract `
            tools/windows_gaming_node_entry.py

      - name: Smoke test executable
        shell: pwsh
        run: .\dist\NekoSuneAI-Windows-Gaming-Node.exe --help

      - name: Package only Gaming Node runtime files
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $root = "release/NekoSuneAI-Windows-Gaming-Node-$version"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item dist/NekoSuneAI-Windows-Gaming-Node.exe $root/
          Copy-Item config/windows-gaming-agent.example.json "$root/windows-gaming-agent.example.json"
          Copy-Item docs/GAME_SKILLS_AND_REMOTE_PLAY.md "$root/GAME_SKILLS_AND_REMOTE_PLAY.md"
          Copy-Item game-skills "$root/game-skills" -Recurse

          @'
          NekoSuneAI Windows Gaming Node

          This release contains only the Windows Gaming Node runtime, its config example,
          documentation and reviewed game/Remote Play profiles. Docker, Android, server,
          development and unrelated repository files are not included in the release ZIP.

          1. Copy windows-gaming-agent.example.json to windows-gaming-agent.json.
          2. Set your NekoSuneAI Docker/Pi server URL.
          3. Pair the node from the NekoSuneAI dashboard.
          4. Start a reviewed profile with --game <id>.

          Examples:
            NekoSuneAI-Windows-Gaming-Node.exe --config windows-gaming-agent.json --skills-root game-skills --game minecraft
            NekoSuneAI-Windows-Gaming-Node.exe --config windows-gaming-agent.json --skills-root game-skills --game xbox-remote-play
            NekoSuneAI-Windows-Gaming-Node.exe --config windows-gaming-agent.json --skills-root game-skills --game playstation-remote-play

          Xbox/PlayStation profiles currently integrate with authenticated Windows Remote Play clients.
          Direct-console protocol support can be added as a separate backend without changing the branch layout.
          '@ | Set-Content "$root/README-WINDOWS-GAMING-NODE.txt"

          Compress-Archive -Path "$root/*" -DestinationPath "release/NekoSuneAI-Windows-Gaming-Node-$version-build-${{ github.run_number }}.zip" -Force
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NekoSuneAI-Windows-Gaming-Node-${{ steps.package.outputs.version }}
          path: release/*.zip
          if-no-files-found: error

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-gaming-node-v${{ steps.package.outputs.version }}-build-${{ github.run_number }}
          name: Windows Gaming Node v${{ steps.package.outputs.version }} (Build ${{ github.run_number }})
          prerelease: true
          generate_release_notes: false
          body: |
            Standalone NekoSuneAI Windows Gaming Node.

            Release ZIP contains only the Windows Gaming Node executable, config example,
            documentation, and bundled game/console Remote Play profiles.
          files: release/*.zip
