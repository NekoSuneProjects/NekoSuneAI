services:
  sendspin:
    image: ghcr.io/nekosuneprojects/nekosuneai:piproxy-sendspin-1.2.1
    restart: unless-stopped
    init: true
    network_mode: host
    environment:
      PULSE_SERVER: unix:/run/pulse/native
      PULSE_COOKIE: /run/pulse-cookie
    volumes:
      - ./sendspin-data:/data/sendspin
      - ${PULSE_RUNTIME_DIR:-/run/user/1000/pulse}:/run/pulse:ro
      - ${PULSE_COOKIE_FILE:-/home/nekosunevr/.config/pulse/cookie}:/run/pulse-cookie:ro
    command:
      - --settings-dir
      - /data/sendspin
      - --name
      - ${SENDSPIN_NAME:-NekoSuneAI Pi Proxy}
      - --port
      - ${SENDSPIN_PORT:-8937}
      - --manufacturer
      - NekoSuneProjects
      - --product-name
      - NekoSuneAI Pi Proxy
      # Do not force '--audio-device pulse': it is an ALSA plugin name,
      # not necessarily a device Sendspin can resolve via PortAudio.
      # The image maps the ALSA default output to PulseAudio/PipeWire.
      - --hardware-volume
      - "false"
