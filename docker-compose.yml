services:
  nekosuneai:
    build:
      context: .
      args:
        APP_VERSION: "1.2.1"
    image: ghcr.io/nekosuneprojects/nekosuneai:1.2.1
    restart: unless-stopped
    # Protect small hosts such as an 8 GB Raspberry Pi from a runaway decoder,
    # extractor or model process taking the entire machine down. Override these
    # in .env on larger hosts if desired.
    mem_limit: ${NEKOSUNEAI_MEMORY_LIMIT:-6g}
    cpus: ${NEKOSUNEAI_CPU_LIMIT:-3.5}
    pids_limit: ${NEKOSUNEAI_PIDS_LIMIT:-256}
    stop_grace_period: 15s
    # Start as root only for the entrypoint. It scans the host runtime sessions,
    # finds the owner of a working PulseAudio/PipeWire socket, then drops to that
    # UID/GID before NekoSuneAI starts. No PUID/PGID setup is normally required.
    stdin_open: true
    tty: true
    network_mode: host
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./audio:/app/audio
      - nekosuneai-models:/app/models
      # Xbox 360 Kinect exposes several USB interfaces (camera/motor/audio).
      # Mount the bus and allow USB character devices through the Docker cgroup.
      - /dev/bus/usb:/dev/bus/usb
      # Read all desktop runtime sessions so startup can locate the real audio
      # owner automatically instead of assuming /run/user/1000.
      - /run/user:/run/user:ro
      # BlueZ stays on the host. bluetoothctl inside the container talks to the
      # host daemon over this D-Bus socket to reconnect already-paired speakers.
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
    device_cgroup_rules:
      - 'c 189:* rwm'
    devices:
      - /dev/snd:/dev/snd
    environment:
      NEKOSUNEAI_AUTO_AUDIO: ${NEKOSUNEAI_AUTO_AUDIO:-true}
      # Docker voice installs automatically recover a paired Bluetooth speaker.
      # BLUETOOTH_SPEAKER_ADDRESS is optional; Alexa/Echo is auto-discovered.
      BLUETOOTH_RECONNECT_ENABLED: ${BLUETOOTH_RECONNECT_ENABLED:-true}
      PIPEWIRE_REMOTE: ${PIPEWIRE_REMOTE:-pipewire-0}
      WEB_DASHBOARD_HOST: 0.0.0.0
      WEB_DASHBOARD_PORT: 8788

volumes:
  nekosuneai-models:
