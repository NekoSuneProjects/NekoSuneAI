services:
  nekosuneai:
    build:
      context: .
      args:
        APP_VERSION: "1.2.1"
    image: ghcr.io/nekosuneprojects/nekosuneai:1.2.1
    restart: unless-stopped
    # Protect small hosts such as an 8 GB Raspberry Pi from a runaway decoder,
    # extractor or model process taking the entire machine down. Override these
    # in .env on larger hosts if desired.
    mem_limit: ${NEKOSUNEAI_MEMORY_LIMIT:-6g}
    cpus: ${NEKOSUNEAI_CPU_LIMIT:-3.5}
    pids_limit: ${NEKOSUNEAI_PIDS_LIMIT:-256}
    stop_grace_period: 15s
    stdin_open: true
    tty: true
    network_mode: host
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./audio:/app/audio
      - nekosuneai-models:/app/models
      - /dev/bus/usb:/dev/bus/usb
      - /run/user:/run/user:ro
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
    device_cgroup_rules:
      - 'c 189:* rwm'
    devices:
      - /dev/snd:/dev/snd
    environment:
      NEKOSUNEAI_AUTO_AUDIO: ${NEKOSUNEAI_AUTO_AUDIO:-true}
      BLUETOOTH_RECONNECT_ENABLED: ${BLUETOOTH_RECONNECT_ENABLED:-true}
      PIPEWIRE_REMOTE: ${PIPEWIRE_REMOTE:-pipewire-0}
      WEB_DASHBOARD_HOST: 0.0.0.0
      WEB_DASHBOARD_PORT: 8788

      # One public origin for the dashboard, public avatar, APIs and ntfy.
      # Your reverse proxy only needs to forward this hostname to port 8788.
      NEKOSUNEAI_PUBLIC_URL: ${NEKOSUNEAI_PUBLIC_URL:-https://nekosuneai.nekosunevr.co.uk}

      # When a password is configured, the web dashboard uses an HttpOnly
      # session cookie and no longer requires ?token= in browser URLs.
      DASHBOARD_ADMIN_USERNAME: ${DASHBOARD_ADMIN_USERNAME:-admin}
      DASHBOARD_ADMIN_PASSWORD: ${DASHBOARD_ADMIN_PASSWORD:-}
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET:-}
      DASHBOARD_SESSION_TTL_SECONDS: ${DASHBOARD_SESSION_TTL_SECONDS:-43200}
      DASHBOARD_COOKIE_SECURE: ${DASHBOARD_COOKIE_SECURE:-auto}

      # NekoSuneAI publishes to ntfy over localhost. External clients use the
      # same NekoSuneAI HTTPS domain through /ntfy on port 8788.
      MOBILE_NOTIFY_ENABLED: ${MOBILE_NOTIFY_ENABLED:-true}
      MOBILE_NOTIFY_URL: http://127.0.0.1:${NTFY_PORT:-2586}
      MOBILE_NOTIFY_TOPIC: ${MOBILE_NOTIFY_TOPIC:-nekosuneai-alerts}
      MOBILE_NOTIFY_TOKEN: ${MOBILE_NOTIFY_TOKEN:-}
      MOBILE_NOTIFY_MIN_LEVEL: ${MOBILE_NOTIFY_MIN_LEVEL:-warning}
      NTFY_BASE_URL: ${NTFY_BASE_URL:-https://nekosuneai.nekosunevr.co.uk/ntfy}
      NTFY_PORT: ${NTFY_PORT:-2586}

  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: nekosuneai-ntfy
    restart: unless-stopped
    command: serve
    environment:
      # ntfy knows its public path is under the single NekoSuneAI domain.
      NTFY_BASE_URL: ${NTFY_BASE_URL:-https://nekosuneai.nekosunevr.co.uk/ntfy}
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_ATTACHMENT_CACHE_DIR: /var/cache/ntfy/attachments
    volumes:
      - ./data/ntfy/cache:/var/cache/ntfy
      - ./data/ntfy/etc:/etc/ntfy
    ports:
      # Private loopback-only upstream. It is not exposed to the LAN/Internet;
      # NekoSuneAI proxies /ntfy through its single public port 8788.
      - "127.0.0.1:${NTFY_PORT:-2586}:80"

volumes:
  nekosuneai-models:
