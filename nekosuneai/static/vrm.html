<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{display:block}#s{position:fixed;left:10px;bottom:10px;color:#c4b5fd;font:11px system-ui;background:#0b0c1ccc;padding:5px 8px;border-radius:9px}</style></head><body><div id="s">Loading avatar…</div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/","@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.1.2/lib/three-vrm.module.min.js"}}</script><script type="module">import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{VRMLoaderPlugin}from'@pixiv/three-vrm';const status=document.getElementById('s'),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(28,innerWidth/innerHeight,.1,20),renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0,0);document.body.appendChild(renderer.domElement);camera.position.set(0,1.35,2.35);scene.add(new THREE.HemisphereLight(0xffffff,0x333344,2.3));const key=new THREE.DirectionalLight(0xffffff,2);key.position.set(1,2,2);scene.add(key);let vrm=null,emotion='neutral',targetBlink=0;function setExpression(name,value){try{vrm?.expressionManager?.setValue(name,value)}catch{}}function applyEmotion(next){emotion=next||'neutral';for(const n of['happy','sad','angry','relaxed','surprised'])setExpression(n,0);const map={happy:'happy',sad:'sad',angry:'angry',excited:'surprised',surprised:'surprised',relaxed:'relaxed'};if(map[emotion])setExpression(map[emotion],.75)}window.addEventListener('message',e=>{if(e.data?.type==='neko-emotion')applyEmotion(e.data.emotion);if(e.data?.type==='neko-speaking')setExpression('aa',e.data.active?.25:0)});async function load(){try{const r=await fetch('/api/avatar/config'+location.search,{cache:'no-store'});const j=await r.json();if(!j.url)throw new Error('Set VRM_AVATAR_URL on the Pi');const loader=new GLTFLoader();loader.register(p=>new VRMLoaderPlugin(p));loader.load(j.url,g=>{vrm=g.userData.vrm;vrm.scene.rotation.y=Math.PI;scene.add(vrm.scene);status.textContent='NekoSuneAI';applyEmotion('neutral')},undefined,e=>status.textContent=e.message)}catch(e){status.textContent=e.message}}load();const clock=new THREE.Clock();let blinkAt=performance.now()+2500;function tick(){requestAnimationFrame(tick);const dt=clock.getDelta(),now=performance.now();if(vrm){vrm.update(dt);vrm.scene.rotation.y=Math.PI+Math.sin(now/4500)*.045;if(now>blinkAt){targetBlink=1;blinkAt=now+2500+Math.random()*3500}const b=targetBlink?Math.min(1,(now-(blinkAt-500))/90):0;if(targetBlink){setExpression('blink',b);if(b>=1){setTimeout(()=>setExpression('blink',0),90);targetBlink=0}}}renderer.render(scene,camera)}tick();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
