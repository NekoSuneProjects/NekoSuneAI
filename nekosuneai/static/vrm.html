<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{display:block}#s{position:fixed;left:10px;bottom:10px;color:#c4b5fd;font:11px system-ui;background:#0b0c1ccc;padding:5px 8px;border-radius:9px}</style></head><body><div id="s">Loading avatar…</div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/","@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.1.2/lib/three-vrm.module.min.js"}}</script><script type="module">
import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{VRMLoaderPlugin}from'@pixiv/three-vrm';
const status=document.getElementById('s'),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(28,innerWidth/innerHeight,.1,20),renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0,0);document.body.appendChild(renderer.domElement);camera.position.set(0,1.30,1.65);scene.add(new THREE.HemisphereLight(0xffffff,0x333344,2.3));const key=new THREE.DirectionalLight(0xffffff,2);key.position.set(1,2,2);scene.add(key);
let vrm=null,emotion='neutral',gesture='idle',targetBlink=0,currentViseme='';
function setExpression(name,value){try{vrm?.expressionManager?.setValue(name,value)}catch{}}
function clearMouth(){for(const n of['aa','ih','ou','ee','oh'])setExpression(n,0)}
function applyViseme(name,weight){clearMouth();currentViseme=name||'';if(currentViseme)setExpression(currentViseme,Math.max(0,Math.min(1,Number(weight)||0)))}
function applyEmotion(next){emotion=next||'neutral';for(const n of['happy','sad','angry','relaxed','surprised'])setExpression(n,0);const map={happy:'happy',sad:'sad',angry:'angry',excited:'surprised',surprised:'surprised',relaxed:'relaxed'};if(emotion==='scared'){setExpression('sad',.45);setExpression('surprised',.38)}else if(map[emotion])setExpression(map[emotion],.72)}
function bone(name){try{return vrm?.humanoid?.getNormalizedBoneNode(name)||null}catch{return null}}
function setRot(name,x=0,y=0,z=0){const b=bone(name);if(b){b.rotation.x=x;b.rotation.y=y;b.rotation.z=z}}
function naturalArms(now){const sway=Math.sin(now/1200)*.025;setRot('leftUpperArm',.04,0,1.18+sway);setRot('rightUpperArm',.04,0,-1.18-sway);setRot('leftLowerArm',-.10,0,.10);setRot('rightLowerArm',-.10,0,-.10);}
function pose(now){if(!vrm)return;const wave=Math.sin(now/180)*.25,breathe=Math.sin(now/900)*.025;setRot('chest',breathe,0,0);setRot('neck',0,Math.sin(now/2400)*.04,0);naturalArms(now);if(gesture==='wave'){setRot('rightUpperArm',-.35,0,-.35);setRot('rightLowerArm',-.25,0,-1.18+wave)}else if(gesture==='excited'){setRot('leftUpperArm',-.30,0,.62);setRot('rightUpperArm',-.30,0,-.62);setRot('leftLowerArm',-.35,0,.38);setRot('rightLowerArm',-.35,0,-.38)}else if(gesture==='guarded'){setRot('leftUpperArm',-.55,0,.72);setRot('rightUpperArm',-.55,0,-.72);setRot('leftLowerArm',-.55,0,-.38);setRot('rightLowerArm',-.55,0,.38);setRot('chest',.10,0,0)}else if(gesture==='slouch'){setRot('chest',.16,0,0);setRot('neck',.10,0,0);setRot('leftUpperArm',.10,0,1.08);setRot('rightUpperArm',.10,0,-1.08)}else if(gesture==='emphatic'){setRot('rightUpperArm',-.20,0,-.62);setRot('rightLowerArm',-.25,0,-.65+Math.sin(now/260)*.08)}else if(gesture==='relaxed'){setRot('leftUpperArm',.10,0,1.25);setRot('rightUpperArm',.10,0,-1.25);setRot('leftLowerArm',-.15,0,.14);setRot('rightLowerArm',-.15,0,-.14)}}
function frameAvatar(){if(!vrm)return;try{const box=new THREE.Box3().setFromObject(vrm.scene),size=new THREE.Vector3(),center=new THREE.Vector3();box.getSize(size);box.getCenter(center);const h=Math.max(.8,size.y||1.6),fov=THREE.MathUtils.degToRad(camera.fov),distance=(h*.5)/Math.tan(fov*.5)*.72,verticalOffset=h*.07;camera.position.set(center.x,center.y+verticalOffset+h*.02,Math.max(1.05,distance));camera.lookAt(center.x,center.y+verticalOffset,center.z)}catch{camera.position.set(0,1.36,1.65);camera.lookAt(0,1.31,0)}}
window.addEventListener('message',e=>{if(e.data?.type==='neko-emotion')applyEmotion(e.data.emotion);if(e.data?.type==='neko-speaking'&&!e.data.active)applyViseme('',0);if(e.data?.type==='neko-viseme')applyViseme(e.data.name,e.data.weight);if(e.data?.type==='neko-gesture')gesture=e.data.gesture||'idle'});
async function load(){try{const r=await fetch('/api/avatar/config',{cache:'no-store'});const j=await r.json();if(!j.url)throw new Error('Upload a VRM from /avatar-upload.html or set VRM_AVATAR_URL on the Pi');const loader=new GLTFLoader();loader.register(p=>new VRMLoaderPlugin(p));loader.load(new URL(j.url,location.origin).toString(),g=>{vrm=g.userData.vrm;vrm.scene.rotation.y=Math.PI;scene.add(vrm.scene);frameAvatar();status.textContent=j.companion||'NekoSuneAI';applyEmotion(j.mood||'neutral');gesture=j.gesture||'idle'},undefined,e=>status.textContent=e.message)}catch(e){status.textContent=e.message}}load();
const clock=new THREE.Clock();let blinkAt=performance.now()+2500;function tick(){requestAnimationFrame(tick);const dt=clock.getDelta(),now=performance.now();if(vrm){vrm.update(dt);vrm.scene.rotation.y=Math.PI+Math.sin(now/4500)*.045;pose(now);if(now>blinkAt){targetBlink=1;blinkAt=now+2500+Math.random()*3500}const b=targetBlink?Math.min(1,(now-(blinkAt-500))/90):0;if(targetBlink){setExpression('blink',b);if(b>=1){setTimeout(()=>setExpression('blink',0),90);targetBlink=0}}}renderer.render(scene,camera)}tick();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);if(vrm)frameAvatar()});
</script></body></html>
