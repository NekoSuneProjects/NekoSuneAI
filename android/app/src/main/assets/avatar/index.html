<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0b14;color:white;font-family:system-ui}#status{position:fixed;left:10px;top:10px;z-index:2;background:#171a31cc;padding:7px 10px;border-radius:10px;font-size:12px}canvas{display:block}</style></head>
<body><div id="status">VRM viewer ready</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/","@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.1.2/lib/three-vrm.module.min.js"}}</script>
<script type="module">
import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{VRMLoaderPlugin}from'@pixiv/three-vrm';
const status=document.getElementById('status'),scene=new THREE.Scene();scene.background=new THREE.Color(0x0a0b14);const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,.1,20);camera.position.set(0,1.35,2.6);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x333344,2.2));const key=new THREE.DirectionalLight(0xffffff,2);key.position.set(1,2,2);scene.add(key);const floor=new THREE.Mesh(new THREE.CircleGeometry(1.2,64),new THREE.MeshStandardMaterial({color:0x181a2d,roughness:1}));floor.rotation.x=-Math.PI/2;scene.add(floor);
let vrm=null,emotion='neutral',gesture='idle';const url=new URL(location.href).searchParams.get('model');
function expr(name,value){try{vrm?.expressionManager?.setValue(name,value)}catch{}}
function clearMouth(){for(const n of['aa','ih','ou','ee','oh'])expr(n,0)}
window.setNekoViseme=(name,weight)=>{clearMouth();if(name)expr(name,Math.max(0,Math.min(1,Number(weight)||0)))};
window.setNekoEmotion=(next)=>{emotion=next||'neutral';for(const n of['happy','sad','angry','relaxed','surprised'])expr(n,0);const map={happy:'happy',sad:'sad',angry:'angry',excited:'surprised',surprised:'surprised',relaxed:'relaxed'};if(emotion==='scared'){expr('sad',.45);expr('surprised',.38)}else if(map[emotion])expr(map[emotion],.8)};
window.setNekoGesture=(next)=>{gesture=next||'idle'};window.setNekoSpeaking=(active)=>{if(!active)window.setNekoViseme('',0)};
function bone(name){try{return vrm?.humanoid?.getNormalizedBoneNode(name)||null}catch{return null}}function rot(name,x=0,y=0,z=0){const b=bone(name);if(b){b.rotation.x=x;b.rotation.y=y;b.rotation.z=z}}
function pose(now){if(!vrm)return;const wave=Math.sin(now/180)*.25,breathe=Math.sin(now/900)*.025;rot('chest',breathe,0,0);rot('neck',0,Math.sin(now/2400)*.04,0);rot('leftUpperArm',0,0,-.10);rot('rightUpperArm',0,0,.10);rot('leftLowerArm',0,0,0);rot('rightLowerArm',0,0,0);if(gesture==='wave'){rot('rightUpperArm',-.35,0,-1.05);rot('rightLowerArm',-.25,0,-.65+wave)}else if(gesture==='excited'){rot('leftUpperArm',-.30,0,.82);rot('rightUpperArm',-.30,0,-.82);rot('leftLowerArm',-.35,0,.28);rot('rightLowerArm',-.35,0,-.28)}else if(gesture==='guarded'){rot('leftUpperArm',-.55,0,.42);rot('rightUpperArm',-.55,0,-.42);rot('leftLowerArm',-.55,0,-.38);rot('rightLowerArm',-.55,0,.38);rot('chest',.10,0,0)}else if(gesture==='slouch'){rot('chest',.16,0,0);rot('neck',.10,0,0)}else if(gesture==='emphatic'){rot('rightUpperArm',-.20,0,-.72);rot('rightLowerArm',-.25,0,-.35+Math.sin(now/260)*.08)}else if(gesture==='relaxed'){rot('leftUpperArm',.08,0,-.18);rot('rightUpperArm',.08,0,.18)}}
if(url){status.textContent='Loading VRM…';const loader=new GLTFLoader();loader.register(p=>new VRMLoaderPlugin(p));loader.load(url,gltf=>{vrm=gltf.userData.vrm;vrm.scene.rotation.y=Math.PI;scene.add(vrm.scene);status.textContent='NekoSuneAI';window.setNekoEmotion('neutral')},undefined,e=>{status.textContent='VRM load failed: '+e.message})}else{status.textContent='Connect to your Pi to load its VRM avatar'}
const clock=new THREE.Clock();let blinkAt=performance.now()+2200,blink=false;function tick(){requestAnimationFrame(tick);const dt=clock.getDelta(),now=performance.now();if(vrm){vrm.update(dt);vrm.scene.rotation.y=Math.PI+Math.sin(now/4000)*.06;pose(now);if(now>blinkAt&&!blink){blink=true;expr('blink',1);setTimeout(()=>{expr('blink',0);blink=false},100);blinkAt=now+2400+Math.random()*3200}}renderer.render(scene,camera)}tick();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
