android.useAndroidX=true
android.nonTransitiveRClass=true

# Keep Android builds stable on smaller self-hosted runners. D8/R8, Kotlin and
# Gradle workers can otherwise overlap and trigger the Linux OOM killer during
# mergeExtDexDebug.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
