# ─────────────────────────────────────────────────────────────────────────────
# NekoSuneAI — GitLab CI/CD  (self-hosted GitLab + runners)
#
# Pipelines:
#   validate            byte-compile + import smoke test            (any docker runner)
#   desktop:linux       PyInstaller one-dir build -> artifact        (docker runner)
#   desktop:windows     PyInstaller .exe build -> artifact           (runner tagged: windows)
#   release             attach desktop artifacts to a tag release    (any runner, tags only)
#
# RUNNER REQUIREMENTS
#   • desktop:windows needs a Windows shell runner tagged `windows` with Python
#     3.10 + git on PATH. If you have no Windows runner, that job simply stays
#     un-picked — the rest of the pipeline is unaffected.
# ─────────────────────────────────────────────────────────────────────────────

stages:
  - validate
  - desktop
  - release

variables:
  PYTHON_VERSION: "3.10.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

# ── validate ────────────────────────────────────────────────────────────────
validate:
  stage: validate
  image: "python:${PYTHON_VERSION}-slim"
  script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    # Every module must byte-compile (catches syntax/merge breakage fast).
    - python -m compileall -q nekosuneai app.py
    # Core modules must import cleanly with only the base deps installed.
    - python -c "import nekosuneai.updater, nekosuneai.config; print('import OK')"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# ── desktop: Linux one-dir bundle ─────────────────────────────────────────────
desktop:linux:
  stage: desktop
  image: "python:${PYTHON_VERSION}-slim"
  variables:
    NOVA_VERSION: "$CI_COMMIT_TAG"
  script:
    - apt-get update && apt-get install -y --no-install-recommends binutils && rm -rf /var/lib/apt/lists/*
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt pyinstaller
    # Headless/CLI build. (The pywebview desktop window needs system WebKitGTK
    # at runtime; install it on the target to also use --gui.)
    - >
      pyinstaller --noconfirm --clean --name NekoSuneAI
      --add-data "nekosuneai/static:nekosuneai/static"
      --collect-submodules nekosuneai
      app.py
    - cp .env.example dist/NekoSuneAI/.env.example || true
    - cp VERSION dist/NekoSuneAI/VERSION || true
    - cd dist && tar -czf "NekoSuneAI-linux-${CI_COMMIT_SHORT_SHA}.tar.gz" NekoSuneAI
  artifacts:
    name: "NekoSuneAI-linux-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/NekoSuneAI-linux-*.tar.gz
    expire_in: 2 weeks
  rules:
    - if: '$CI_COMMIT_TAG'
    - when: manual
      allow_failure: true

# ── desktop: Windows .exe (needs a runner tagged `windows`) ───────────────────
desktop:windows:
  stage: desktop
  tags:
    - windows
  script:
    - py -3.10 -m pip install --upgrade pip
    - py -3.10 -m pip install -r requirements.txt -r requirements-gui.txt pyinstaller
    # Windows ships the pywebview CEF backend, so the bundle includes the native
    # desktop window (`NekoSuneAI.exe --gui`) as well as CLI mode.
    - >
      py -3.10 -m PyInstaller --noconfirm --clean --name NekoSuneAI --windowed
      --add-data "nekosuneai/static;nekosuneai/static"
      --collect-submodules nekosuneai
      --collect-all webview
      app.py
    - copy .env.example dist\NekoSuneAI\.env.example
    - copy VERSION dist\NekoSuneAI\VERSION
  artifacts:
    name: "NekoSuneAI-windows-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/NekoSuneAI/
    expire_in: 2 weeks
  rules:
    - if: '$CI_COMMIT_TAG'
    - when: manual
      allow_failure: true

# ── release: attach the desktop artifacts to the tag ──────────────────────────
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: desktop:linux
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "Publishing release $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "NekoSuneAI $CI_COMMIT_TAG"
    description: "Automated release for $CI_COMMIT_TAG."
